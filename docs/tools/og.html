<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: Geist;
      src: url("../assets/fonts/Geist-Variable.woff2");
      font-weight: 100 900
    }

    html,
    body {
      margin: 0;
      background: #000;
      width: 1200px;
      height: 630px
    }

    body {
      font-family: Geist, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 96px;
      box-sizing: border-box;
      gap: 24px
    }

    p {
      margin: 0
    }

    .k {
      font-size: 24px;
      color: #9b9b9b;
      font-weight: 500
    }

    h1 {
      margin: 0;
      font-size: 72px;
      line-height: 1;
      font-weight: 600;
      max-width: 900px;
      background: linear-gradient(90deg, #fff, #9b9b9b);
      -webkit-background-clip: text;
      color: transparent
    }

    .s {
      font-size: 24px;
      color: #9b9b9b;
      max-width: 680px;
      line-height: 32px
    }
  </style>
</head>

<body>
  <p class="k">Manikandan M · Software architect at IBM</p>
  <h1>Secure software, ready for audit</h1>
  <p class="s">Data security, compliance automation and full stack architecture. 13+ years.</p>
</body>

</html>
